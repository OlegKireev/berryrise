schema: spec-driven

# Стек, структура и конвенции описаны в CLAUDE.md, здесь только ограничения для артефактов
context: |
  Write all artifacts in Russian. Code identifiers, file paths and commit messages stay in English.
  Product spec lives in docs/idea.md: check it before proposing a feature.
  Android-first; iOS must not break, but iOS-only work is out of scope unless stated.
  No analytics or accounts: user data never leaves the device (except Android Auto Backup and manual export). The only network request is the OTA update check on launch (expo-updates), with no user data.
  Development happens in a development build (expo-dev-client), not Expo Go; a new package with native code or a config plugin requires rebuilding it, call it out in design.

rules:
  proposal:
    - State what is out of scope
  design:
    - For DB changes, describe the migration (PRAGMA user_version) and keep id/createdAt/updatedAt/deletedAt
  tasks:
    - Add user-facing strings to both ru and en in the owning slice's i18n.ts (shared/i18n/common.ts only for shared words)
    - Tests only for pure logic (streak, money, calories, achievements)
    - Last task is running yarn typecheck and yarn lint
